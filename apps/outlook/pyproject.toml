[project]
name = "outlook-clone"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "uvicorn",
    "fastapi",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "psycopg2-binary",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "passlib[bcrypt]",
    "python-multipart",
    "python-jose[cryptography]",
    "requests",
    "python-dotenv",
    "structlog",
    "python-docx",
    "openpyxl",
    "reportlab",
    "python-pptx",
    "pillow",
    # fastapi.TestClient + httpx are used by app/server.py's call_tool
    # dispatcher (in-process tool routing) and by app/tests/test_tools.py.
    "httpx",
]
