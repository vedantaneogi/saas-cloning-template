<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" width="40" height="40">
  <!-- DocuSign "d" mark: two overlapping rounded squares, red top-left, indigo bottom-right -->
  <!-- Indigo/purple square (back layer, bottom-right) -->
  <rect x="8" y="8" width="32" height="32" rx="3" fill="#3B1FA3"/>
  <!-- Red/coral square (front layer, top-left) -->
  <rect x="0" y="0" width="26" height="26" rx="3" fill="#E8342A"/>
</svg>
