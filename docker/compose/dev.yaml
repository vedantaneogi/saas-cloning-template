services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: outlook
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - outlook_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d outlook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  outlook_pg_data:
